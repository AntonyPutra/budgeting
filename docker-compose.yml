version: '3.8'

services:
  # ==========================================
  # 1. Database PostgreSQL di Server Homelab
  # Port 5434 hanya di-bind ke IP Tailscale
  # ==========================================
  finbot-db:
    image: postgres:16-alpine
    container_name: finbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finbot_db
      POSTGRES_USER: finbot_user
      POSTGRES_PASSWORD: supersecretfinbot2026
      TZ: Asia/Jakarta
    ports:
      # Hanya bisa diakses dari MacBook lewat Tailscale via TablePlus
      - "100.73.16.92:5434:5432"
    volumes:
      - finbot_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - finbot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbot_user -d finbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis untuk Session Evolution API
  # ==========================================
  finbot-redis:
    image: redis:7-alpine
    container_name: finbot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - finbot_redisdata:/data
    networks:
      - finbot_net

  # ==========================================
  # 3. WhatsApp Gateway (Evolution API)
  # ==========================================
  finbot-wa:
    image: atendai/evolution-api:v2.1.1
    container_name: finbot_evolution
    restart: unless-stopped
    ports:
      - "8081:8080" # Port 8080 server sudah dipakai bukutamu_web
    environment:
      - SERVER_URL=http://100.73.16.92:8081
      - AUTHENTICATION_API_KEY=finbotsecretkey2026
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://finbot_user:supersecretfinbot2026@finbot-db:5432/finbot_db?schema=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://finbot-redis:6379/1
    volumes:
      - finbot_instances:/evolution/instances
    depends_on:
      - finbot-db
      - finbot-redis
    networks:
      - finbot_net

  # ==========================================
  # 4. Backend Engine (FinBot AI Engine)
  # ==========================================
  finbot-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finbot_backend
    restart: unless-stopped
    ports:
      - "8001:8000" # Expose ke 8001 (8000 sudah dipakai sihelp_backend)
    environment:
      - PORT=8000
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - DB_HOST=finbot-db
      - DB_PORT=5432
      - DB_USER=finbot_user
      - DB_PASSWORD=supersecretfinbot2026
      - DB_NAME=finbot_db
      - DATABASE_URL=postgresql://finbot_user:supersecretfinbot2026@finbot-db:5432/finbot_db?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - WA_GATEWAY_URL=http://finbot-wa:8080
      - WA_GATEWAY_API_KEY=finbotsecretkey2026
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-finbot}
      - TONYY_WHATSAPP_NUMBER=${TONYY_WHATSAPP_NUMBER:-6281234567890}
    depends_on:
      finbot-db:
        condition: service_healthy
      finbot-wa:
        condition: service_started
    networks:
      - finbot_net

  # ==========================================
  # 5. Web Dashboard (FinBot UI)
  # ==========================================
  finbot-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finbot_web
    restart: unless-stopped
    ports:
      - "3002:3000" # Expose ke 3002 (3000 sudah dipakai ftikfest-web)
    environment:
      - PORT=3000
      - BACKEND_API_URL=http://finbot-backend:8000
      - PUBLIC_BACKEND_URL=http://100.73.16.92:8001
    depends_on:
      - finbot-backend
    networks:
      - finbot_net

volumes:
  finbot_pgdata:
  finbot_redisdata:
  finbot_instances:

networks:
  finbot_net:
    name: finbot_net
    driver: bridge
