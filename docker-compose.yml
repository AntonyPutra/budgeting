services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # Persistensi ke host: /opt/finbot/data/postgres
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: finbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finbot_homelab_secret}
      POSTGRES_DB: ${POSTGRES_DB:-monthlybudget}
      TZ: Asia/Jakarta
    volumes:
      # Arahkan ke storage server host untuk kemudahan backup cronjob
      - /opt/finbot/data/postgres:/var/lib/postgresql/data
    networks:
      - budget_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finbot} -d ${POSTGRES_DB:-monthlybudget}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. FinBot AI Engine Backend
  # ==========================================
  finbot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finbot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      TZ: Asia/Jakarta
      # Database URL menuju service postgres di jaringan internal budget_net
      DATABASE_URL: "postgresql://${POSTGRES_USER:-finbot}:${POSTGRES_PASSWORD:-finbot_homelab_secret}@postgres:5432/${POSTGRES_DB:-monthlybudget}?schema=public"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-finbot}
      TONYY_WHATSAPP_NUMBER: ${TONYY_WHATSAPP_NUMBER:-6281234567890}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    networks:
      - budget_net

  # ==========================================
  # 3. Evolution API (WhatsApp Gateway)
  # Uncomment jika ingin dijalankan dalam compose yang sama
  # ==========================================
  # evolution-api:
  #   image: atendai/evolution-api:v2.1.2
  #   container_name: finbot-evolution-api
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SERVER_URL: http://localhost:8080
  #     AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
  #     DATABASE_ENABLED: "false"
  #   networks:
  #     - budget_net

networks:
  budget_net:
    name: budget_net
    driver: bridge
